<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘れ物おみくじ</title>

    <style>
        body {
            font-family: "Yu Gothic", sans-serif;
            background: #eef5ff;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #0077cc;
            margin-bottom: 25px;
        }

        button {
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #005fa3;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            button {
                width: 90%;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎒 忘れ物おみくじ</h1>

    <p>今日はどこへ行く？</p>

    <select id="place">
        <option value="school">🏫 学校</option>
        <option value="baito">💼 バイト</option>
        <option value="club">⚽ 部活</option>
    </select>

    <br>

    <button onclick="draw()">診断する！</button>

    <div id="result">
        <h2>🎯 忘れ物診断</h2>
        <p>「診断する！」を押して今日の持ち物をチェックしよう！</p>
    </div>

</div>

<script>
    const school = [
        "📚 教科書は持った？",
        "✏️ 筆箱はある？",
        "🎓 学生証を忘れてない？",
        "💰 財布はOK？",
        "📱 スマホはある？"
    ];

    const baito = [
        "👕 制服はある？",
        "🪪 名札は持った？",
        "👛 財布はある？",
        "📱 スマホはOK？",
        "🔑 家の鍵は持った？"
    ];

    const club = [
        "⚽ シューズはある？",
        "🥤 水筒は持った？",
        "🧺 タオルはある？",
        "👕 ユニフォームはOK？",
        "📱 スマホはある？"
    ];

    function draw() {
        const place = document.getElementById("place").value;
        const result = document.getElementById("result");

        result.innerHTML = '<div class="loading">🎲 診断中...</div>';

        setTimeout(function () {
            let list;

            if (place === "school") {
                list = school;
            } else if (place === "baito") {
                list = baito;
            } else {
                list = club;
            }

            const random = Math.floor(Math.random() * list.length);

            result.innerHTML = `
                <h2>🎯 診断結果</h2>
                <p>${list[random]}</p>
                <h3>✨ 忘れ物がないかもう一度確認しよう！</h3>
            `;
        }, 2000);
    }
</script>

</body>
</html>
